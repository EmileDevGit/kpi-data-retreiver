services:
  nextjs-standalone:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-standalone-image
    container_name: nextjs-standalone-container
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/mydb?schema=public"
      DEVICE_CREDENTIAL_KEY: "${DEVICE_CREDENTIAL_KEY:?DEVICE_CREDENTIAL_KEY must be set in .env}"
      POLLING_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped
    develop:
      watch:
        # 1. Sync stateless frontend/backend code instantly
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true  # Ensures host and container match on startup

        # 2. Rebuild the container if dependencies change
        - action: rebuild
          path: ./package.json

  db:
    image: postgres:16-alpine
    container_name: postgres-db-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
